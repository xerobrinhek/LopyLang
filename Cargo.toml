[package]
name = "LopyLang"
version = "0.1.0"
edition = "2024"

[dependencies]
unicode-xid = "0.2.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
flate2 = "1.0"
semver = "1.0"
toml = "0.8"
regex = "1.10"
tar = "0.4"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
home = "0.5.12"
arkiv = { version = "0.7", features = ["download", "zip"] }
onpath = "0.2.0"
zip = "0.6.6"